<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Your Fan: Neon Sign Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        h1 {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 26px;
            margin: 20px 15px;
        }

        .left-box {
            position: absolute;
            top: 80px;
            left: 40px;
        }

        .right-box {
            position: absolute;
            top: 80px;
            right: 40px;
        }

        input[type="text"] {
            width: 260px;
            padding: 8px;
            font-size: 15px;
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #555555;
            cursor: auto;
        }

        input[type="button"],
        select {
            padding: 8px 12px;
            font-size: 14px;
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #555555;
            cursor: pointer;
        }

        .color-btn {
            width: 30px;
            height: 30px;
            margin-right: 5px;
            margin-top: 10px;
            border: 1px solid #ffffff;
            cursor: pointer;
        }

        .led-container {
            width: 100%;
            height: 100vh;
            white-space: nowrap;
            overflow: hidden; /* ?? */
            display: flex; /* ?? */
            align-items: center;
        }

        .led-text {
            display: inline-block;
            font-size: 20vh;
            font-weight: bold;
            color: #00ffcc; /* Default: Mint */
            text-shadow: /* Strong Neon Glow Effect */
                0 0 10px #00ffcc,
                0 0 20px #00ffcc,
                0 0 40px #00ffcc,
                0 0 80px #00ffcc;
        }
    </style>
</head>
<body>

    <h1>I'm Your Fan: Neon Sign Generator</h1>

    <div class="left-box">
        <input type="text" id="txt1" placeholder="Type your cheer message...">
        <input type="button" value="Create" onclick="printMsg();">
        <br>
        <button class="color-btn" style="background-color: #00ffcc" onclick="changeColor('#00ffcc')";></button>
        <button class="color-btn" style="background-color: #ff007f" onclick="changeColor('#ff007f')";></button>
        <button class="color-btn" style="background-color: #9b5de5" onclick="changeColor('#9b5de5')";></button>
        <button class="color-btn" style="background-color: #ffb703" onclick="changeColor('#ffb703')";></button>
        <button class="color-btn" style="background-color: #00b4d8" onclick="changeColor('#00b4d8')";></button>
    </div>

    <div class="right-box">
        <label for="fontSelect">Choose Font: </label>
        <select id="fontSelect" onchange="changeFont();">
            <option value="Arial, sans-serif">Arial</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
            <option value="Courier New, monospace">Courier New</option>
        </select>
    </div>

    <div class="led-container">
        <div id="ledText" class="led-text"></div>
    </div>

    <script>
        let ledText = document.getElementById('ledText');
        let speed = 3;
        let currentPos = 0;

        // Input Text
        function printMsg(){
            let txt = document.getElementById("txt1");

            if (txt.value == "") { // Do Nothing If No Input
                return;
            }

            ledText.innerHTML = txt.value;
            currentPos = window.innerWidth; // Restart From Right End

            txt.value = "";
            txt.focus();
        }

        // Color Select
        function changeColor(color){
            ledText.style.color = color;
            ledText.style.textShadow =
                "0 0 10px " + color + "," +
                "0 0 20px " + color + "," +
                "0 0 40px " + color + "," +
                "0 0 80px " + color;
        }

        // Font Select
        function changeFont() {
            let fontSelect = document.getElementById("fontSelect");
            ledText.style.fontFamily = fontSelect.value;
        }

        // LED Moving
        function moveLED() {
            currentPos -= speed;
            
            if (currentPos < -ledText.offsetWidth) { // Restart From Right End When Text Exits
                currentPos = window.innerWidth;
            }
            
            ledText.style.transform = "translateX(" + currentPos + "px)"; // Without " + + " error happens: Because currentPos is variable
            
            requestAnimationFrame(moveLED); // Like tick!
        }
        
        // When Page Opens, set first Led Text with prompt
        window.onload = function () {
            let msg = prompt("Write the name of a superstar or a message you'd like to cheer on!");

            if (msg == null || msg == "") { // If cancel or empty
                msg = "✨ Treasure Takuma, I'll love you forever ✨";
            }

            ledText.innerHTML = msg;
            currentPos = window.innerWidth;
            moveLED();
        };
    </script>
</body>
</html>
