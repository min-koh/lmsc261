<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    ctx.fillStyle = "lightblue";
    ctx.fillRect(0, 0, w, h);

    for(let i = 0; i < 7; i ++){
        let xPos = 300;
        let yPos = 300;
        let radius = 125 + (i + 1) * 20; // minimum width(offsetting) + (i + 1) * width(scaling);

        ctx.beginPath();
        ctx.arc(xPos,
                yPos,
                radius,
                0,
                Math.PI,
                true);

        ctx.strokeStyle = "pink";
        ctx.lineWidth = 5;
        ctx.stroke(); // stroke, fill 순서에 따라 두꼐가 달라짐.
    }
    
</script>
